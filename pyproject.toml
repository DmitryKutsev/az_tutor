[project]
name = "az-tutor"
version = "0.1.0"
description = "Agent-ready foundation for AZ Tutor on Azure and Azure AI Foundry."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pytest>=9.1.1",
  "pytest-cov>=6.0",
  "ruff>=0.11",
]

[project.scripts]
az-tutor = "az_tutor.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/az_tutor"]

[tool.pytest.ini_options]
addopts = "-q --cov=az_tutor --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["az_tutor"]
mypy_path = "src"
